<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <nav
      th:fragment="navbar"
      class="ct-navbar navbar navbar-expand-lg fixed-top"
    >
      <div class="container px-4">
        <a class="ct-navbar__brand navbar-brand" th:href="@{/}">
          Car<span>to</span>
        </a>

        <button
          class="navbar-toggler ct-navbar__toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="ct-toggler-line"></span>
          <span class="ct-toggler-line"></span>
          <span class="ct-toggler-line"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto gap-2">
            <li
              class="nav-item"
              th:if="${session.user != null and session.user.role.name() == 'Customer'}"
            >
              <a class="nav-link ct-navbar__link" th:href="@{/}">Trang chủ</a>
            </li>
            <li
              class="nav-item"
              th:if="${session.user != null and session.user.role.name() == 'Customer'}"
            >
              <a
                class="nav-link ct-navbar__link"
                th:href="@{/owner/owner-registration}"
                >Đăng ký chủ xe</a
              >
            </li>
          </ul>

          <div class="ct-navbar__actions d-flex align-items-center gap-3">
            <!-- Chưa đăng nhập -->
            <th:block th:if="${session.user == null}">
              <a
                th:href="@{/auth/register}"
                class="ct-btn-nav text-decoration-none d-none d-sm-inline-block text-dark fw-bold me-2"
                >Đăng ký</a
              >
              <a
                th:href="@{/auth/login}"
                class="ct-btn-primary text-decoration-none"
                >Đăng nhập</a
              >
            </th:block>

            <!-- Đã đăng nhập -->
            <th:block th:if="${session.user != null}">
              <div
                class="dropdown"
                th:if="${session.user != null and session.user.role.name() == 'Customer'}"
              >
                <button
                  class="ct-user-dropdown-btn"
                  type="button"
                  id="userMenu"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <div class="ct-user-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                  </div>
                  <span
                    class="ct-user-name d-none d-md-inline"
                    th:text="${session.user != null ? (#strings.isEmpty(session.user.fullName) ? session.user.phone : session.user.fullName) : ''}"
                  ></span>
                  <i class="fa-solid fa-chevron-down ct-chevron"></i>
                </button>

                <ul
                  class="dropdown-menu dropdown-menu-end ct-dropdown-menu"
                  aria-labelledby="userMenu"
                >
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/customer/profile}"
                    >
                      <i class="fa-solid fa-user"></i> Hồ sơ cá nhân
                    </a>
                  </li>
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/booking/my-orders}"
                    >
                      <i class="fa-solid fa-file-contract"></i> Đơn thuê của tôi
                    </a>
                  </li>
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/complaint/my-complaints}"
                    >
                      <i class="fa-solid fa-triangle-exclamation"></i> Khiếu nại của tôi
                    </a>
                  </li>
                  <li>
                    <hr class="ct-dropdown-divider" />
                  </li>

                  <!-- Đăng xuất -->
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item ct-dropdown-item--danger"
                      th:href="@{/auth/logout}"
                    >
                      <i class="fa-solid fa-power-off"></i> Đăng xuất
                    </a>
                  </li>
                </ul>
              </div>

              <div
                class="dropdown"
                th:if="${session.user != null and session.user.role.name() == 'Owner'}"
              >
                <button
                  class="ct-user-dropdown-btn"
                  type="button"
                  id="ownerMenu"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <div class="ct-user-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                  </div>
                  <span
                    class="ct-user-name d-none d-md-inline"
                    th:text="${session.user != null ? (#strings.isEmpty(session.user.fullName) ? session.user.phone : session.user.fullName) : ''}"
                  ></span>
                  <i class="fa-solid fa-chevron-down ct-chevron"></i>
                </button>

                <ul
                  class="dropdown-menu dropdown-menu-end ct-dropdown-menu"
                  aria-labelledby="ownerMenu"
                >
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/customer/profile}"
                    >
                      <i class="fa-solid fa-user"></i> Hồ sơ cá nhân
                    </a>
                  </li>
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/owner/dashboard}"
                    >
                      <i class="fa-solid fa-car-rear"></i> Quản lý xe
                    </a>
                  </li>
                  <li>
                    <hr class="ct-dropdown-divider" />
                  </li>
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item ct-dropdown-item--danger"
                      th:href="@{/auth/logout}"
                    >
                      <i class="fa-solid fa-power-off"></i> Đăng xuất
                    </a>
                  </li>
                </ul>
              </div>

              <div
                class="dropdown"
                th:if="${session.user != null and session.user.role.name() == 'Admin'}"
              >
                <button
                  class="ct-user-dropdown-btn"
                  type="button"
                  id="adminMenu"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <div class="ct-user-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                  </div>
                  <span
                    class="ct-user-name d-none d-md-inline"
                    th:text="${session.user != null ? (#strings.isEmpty(session.user.fullName) ? session.user.phone : session.user.fullName) : ''}"
                  ></span>
                  <i class="fa-solid fa-chevron-down ct-chevron"></i>
                </button>

                <ul
                  class="dropdown-menu dropdown-menu-end ct-dropdown-menu"
                  aria-labelledby="adminMenu"
                >
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item"
                      th:href="@{/admin/dashboard}"
                    >
                      <i class="ti ti-layout-dashboard"></i> Quản trị hệ thống
                    </a>
                  </li>
                  <li>
                    <hr class="ct-dropdown-divider" />
                  </li>
                  <li>
                    <a
                      class="dropdown-item ct-dropdown-item ct-dropdown-item--danger"
                      th:href="@{/auth/logout}"
                    >
                      <i class="ti ti-power"></i> Đăng xuất
                    </a>
                  </li>
                </ul>
              </div>
            </th:block>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
