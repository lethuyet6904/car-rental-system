<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head th:fragment="adminHead(pageTitle)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${pageTitle} + ' — Admin'">Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
</head>

<nav th:fragment="sidebar(activeMenu)" class="admin-sidebar" style="overflow:hidden;display:flex;flex-direction:column">
  <div class="sidebar-logo"> <span>Car</span>to</div>

  <div class="nav-group-label">Tổng quan</div>
  <a th:href="@{/admin/dashboard}" class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''">
    <i class="bi bi-speedometer2"></i> Dashboard
  </a>

  <div class="nav-group-label">Người dùng</div>
  <a th:href="@{/admin/users}" class="sidebar-link" th:classappend="${activeMenu == 'users'} ? ' active' : ''">
    <i class="bi bi-people"></i> Danh sách người dùng
  </a>
  <a th:href="@{/admin/owner-requests}" class="sidebar-link"
    th:classappend="${activeMenu == 'owner-requests'} ? ' active' : ''">
    <i class="bi bi-patch-check"></i> Duyệt yêu cầu chủ xe
  </a>

  <div class="nav-group-label">Xe</div>
  <a th:href="@{/admin/cars}" class="sidebar-link" th:classappend="${activeMenu == 'cars'} ? ' active' : ''">
    <i class="bi bi-car-front"></i> Duyệt xe đăng mới
  </a>

  <div class="nav-group-label">Đơn thuê</div>
  <a th:href="@{/admin/orders}" class="sidebar-link" th:classappend="${activeMenu == 'orders'} ? ' active' : ''">
    <i class="bi bi-file-text"></i> Danh sách đơn thuê
  </a>

  <div class="nav-group-label">Danh mục</div>
  <a th:href="@{/admin/categories/car-types}" class="sidebar-link sub"
    th:classappend="${activeMenu == 'cat-type'} ? ' active' : ''">
    <i class="bi bi-grid"></i> Loại xe
  </a>
  <a th:href="@{/admin/categories/brands}" class="sidebar-link sub"
    th:classappend="${activeMenu == 'cat-brand'} ? ' active' : ''">
    <i class="bi bi-building"></i> Hãng xe
  </a>
  <a th:href="@{/admin/categories/regions}" class="sidebar-link sub"
    th:classappend="${activeMenu == 'cat-region'} ? ' active' : ''">
    <i class="bi bi-geo-alt"></i> Khu vực
  </a>

  <div class="nav-group-label">Khiếu nại</div>
  <a th:href="@{/admin/complaints}" class="sidebar-link"
    th:classappend="${activeMenu == 'complaints'} ? ' active' : ''">
    <i class="bi bi-exclamation-triangle"></i> Danh sách khiếu nại
  </a>

  <div style="margin-top:auto;padding:16px 0 8px">
    <a th:href="@{/}" class="sidebar-link" style="color:#9ca3af">
      <i class="bi bi-house"></i> Về trang chủ
    </a>
  </div>

</nav>

<div th:fragment="topbar(title, breadcrumb)" class="admin-topbar">
  <div>
    <div class="topbar-title" th:text="${title}">Tiêu đề</div>
    <div class="topbar-bc" th:utext="${breadcrumb}">Admin / <span>Module</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:#6b7280" sec:authentication="name">Admin</span>
    <div class="topbar-user">A</div>
  </div>
</div>

<div th:fragment="pagination(page, baseUrl, extraParams)" class="admin-pagination" th:if="${page.totalPages > 1}">

  <!-- Đầu -->
  <a th:if="${!page.first}" th:href="${baseUrl + '?page=0' + extraParams}" title="Trang đầu">
    <i class="bi bi-chevron-double-left" style="font-size:11px"></i>
  </a>
  <span th:if="${page.first}" class="disabled">
    <i class="bi bi-chevron-double-left" style="font-size:11px"></i>
  </span>

  <a th:if="${!page.first}" th:href="${baseUrl + '?page=' + (page.number - 1) + extraParams}">
    <i class="bi bi-chevron-left" style="font-size:11px"></i>
  </a>
  <span th:if="${page.first}" class="disabled">
    <i class="bi bi-chevron-left" style="font-size:11px"></i>
  </span>

  <th:block th:each="i : ${#numbers.sequence(
      T(java.lang.Math).max(0, page.number - 2),
      T(java.lang.Math).min(page.totalPages - 1, page.number + 2))}">
    <a th:if="${i != page.number}" th:href="${baseUrl + '?page=' + i + extraParams}" th:text="${i + 1}">1</a>
    <span th:if="${i == page.number}" class="active" th:text="${i + 1}">1</span>
  </th:block>

  <a th:if="${!page.last}" th:href="${baseUrl + '?page=' + (page.number + 1) + extraParams}">
    <i class="bi bi-chevron-right" style="font-size:11px"></i>
  </a>
  <span th:if="${page.last}" class="disabled">
    <i class="bi bi-chevron-right" style="font-size:11px"></i>
  </span>

  <!-- Cuối -->
  <a th:if="${!page.last}" th:href="${baseUrl + '?page=' + (page.totalPages - 1) + extraParams}" title="Trang cuối">
    <i class="bi bi-chevron-double-right" style="font-size:11px"></i>
  </a>
  <span th:if="${page.last}" class="disabled">
    <i class="bi bi-chevron-double-right" style="font-size:11px"></i>
  </span>
</div>

<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
