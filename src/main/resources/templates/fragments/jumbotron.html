<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="jumbotron" class="ct-jumbotron">
    <div class="ct-jumbotron__bg">
        <img th:src="@{/assets/images/hero-car.jpg}" 
             src="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=1920&q=80" 
             alt="Carto Hero" class="ct-jumbotron__bg-img" />
        <div class="ct-jumbotron__overlay"></div>
    </div>

    <div class="ct-jumbotron__inner">
        <div class="container px-4">
            <div class="ct-hero-content text-center text-lg-start">
                <h1 class="ct-hero-title">
                    Carto – Cùng Bạn <br class="d-none d-lg-block"/>Trên <em>Mọi Hành Trình</em>
                </h1>
                <p class="ct-hero-subtitle d-none d-md-block">
                    Nền tảng chia sẻ ô tô tự lái uy tín, thủ tục nhanh gọn, giao xe tận nhà.
                </p>
            </div>
        </div>
    </div>

    <div class="ct-search-wrap">
        <div class="container px-4">
            <div class="ct-search-card">
                <div class="ct-search-tabs">
                    <button class="ct-search-tab ct-search-tab--active">
                        <i class="fa-solid fa-car-side"></i> Xe tự lái
                    </button>
                </div>

                <form id="searchForm" th:action="@{/cars}" method="get">
                    <div class="ct-search-fields">
                        
                        <div class="ct-field dropdown">
                            <label class="ct-field__label">
                                <i class="fa-solid fa-location-dot"></i> Địa điểm
                            </label>
                        
                            <div class="ct-field__input dropdown-toggle ct-custom-select" data-bs-toggle="dropdown" aria-expanded="false" id="locationDisplay">
                                <span class="text-placeholder">Bạn muốn đi đâu?</span>
                            </div>
                        
                            <ul class="dropdown-menu ct-dropdown-menu w-100 shadow-lg">
                                <li th:each="region : ${regions}">
                                    <a class="dropdown-item" href="#" th:data-value="${region.regionName}" th:text="${region.regionName}"></a>
                                </li>
                            </ul>
                        
                            <input type="hidden" name="city" id="locationValue">
                        </div>

                        <div class="ct-field-divider"></div>

                        <div class="ct-field">
                            <label class="ct-field__label" for="dateFrom">
                                <i class="fa-regular fa-calendar-plus"></i> Nhận xe
                            </label>
                            <div class="ct-field__input" id="homeDateFromTrigger"
                                 style="cursor:pointer; min-height:24px; display:flex;
                                        align-items:center;"
                                 data-bs-toggle="modal" data-bs-target="#homeDateModal">
                                <span id="homePickupText" style="color:#A1A1AA;">mm/dd/yyyy</span>
                            </div>
                            <input type="hidden" name="dateFrom" id="homeDateFrom">
                        </div>

                        <div class="ct-field-divider"></div>

                        <div class="ct-field">
                            <label class="ct-field__label" for="dateTo">
                                <i class="fa-regular fa-calendar-check"></i> Trả xe
                            </label>
                            <div class="ct-field__input" id="homeDateToTrigger"
                                 style="cursor:pointer; min-height:24px; display:flex;
                                        align-items:center;"
                                 data-bs-toggle="modal" data-bs-target="#homeDateModal">
                                <span id="homeReturnText" style="color:#A1A1AA;">mm/dd/yyyy</span>
                            </div>
                            <input type="hidden" name="dateTo" id="homeDateTo">
                        </div>

                        <button type="submit" class="ct-search-btn">
                            <i class="fa-solid fa-magnifying-glass"></i> Tìm xe ngay
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="homeDateModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold mx-auto">Thời gian</h5>
                    <button type="button" class="btn-close ms-0"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold mb-1">
                                Nhận xe
                            </label>
                            <input type="date" id="homeModalPickupDate"
                                   class="form-control mb-2 rounded-3">
                            <input type="time" id="homeModalPickupTime"
                                   class="form-control rounded-3" value="09:00">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold mb-1">
                                Trả xe
                            </label>
                            <input type="date" id="homeModalReturnDate"
                                   class="form-control mb-2 rounded-3">
                            <input type="time" id="homeModalReturnTime"
                                   class="form-control rounded-3" value="09:00">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center
                                bg-light p-3 rounded-3">
                        <div>
                            <div class="fw-semibold text-dark" id="homeModalDateSummary">
                                Chưa chọn ngày
                            </div>
                            <div class="text-muted small">Thời gian thuê:
                                <span id="homeModalDaysSummary"
                                      class="text-success fw-bold">-- ngày</span>
                            </div>
                        </div>
                        <button type="button"
                                class="btn btn-success fw-bold px-4 rounded-3 shadow-sm"
                                id="homeBtnConfirmDate"
                                data-bs-dismiss="modal">Tiếp tục</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropdownItems = document.querySelectorAll('.ct-dropdown-menu .dropdown-item');
    const locationDisplay = document.getElementById('locationDisplay');
    const locationValue = document.getElementById('locationValue');
    
    dropdownItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            const val = this.getAttribute('data-value');
            locationDisplay.innerHTML = `<span style="color: #0F172A; font-weight: 500;">${val}</span>`;
            locationValue.value = val;
        });
    });
});
</script>

</body>
</html>
