<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="jumbotron" class="ct-jumbotron">
    <div class="ct-jumbotron__bg">
        <img th:src="@{/assets/images/hero-car.jpg}" 
             src="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=1920&q=80" 
             alt="Carto Hero" class="ct-jumbotron__bg-img" />
        <div class="ct-jumbotron__overlay"></div>
    </div>

    <div class="ct-jumbotron__inner">
        <div class="container px-4">
            <div class="ct-hero-content text-center text-lg-start">
                <h1 class="ct-hero-title">
                    Carto – Cùng Bạn <br class="d-none d-lg-block"/>Trên <em>Mọi Hành Trình</em>
                </h1>
                <p class="ct-hero-subtitle d-none d-md-block">
                    Nền tảng chia sẻ ô tô tự lái uy tín, thủ tục nhanh gọn, giao xe tận nơi.
                </p>
            </div>
        </div>
    </div>

    <div class="ct-search-wrap">
        <div class="container px-4">
            <div class="ct-search-card">

                <form id="searchForm" th:action="@{/cars}" method="get">
                    <div class="ct-search-fields">
                        
                        <div class="ct-field dropdown">
                            <label class="ct-field__label">
                                <i class="fa-solid fa-location-dot"></i> Địa điểm
                            </label>
                        
                            <div class="ct-field__input dropdown-toggle ct-custom-select" data-bs-toggle="dropdown" aria-expanded="false" id="locationDisplay">
                                <span class="text-placeholder">Bạn muốn đi đâu?</span>
                            </div>
                        
                            <ul class="dropdown-menu ct-dropdown-menu w-100 shadow-lg">
                                <th:block th:if="${locations != null}">
                                    <li th:each="loc : ${locations}">
                                        <a class="dropdown-item" href="#" th:data-value="${loc.name}" th:text="${loc.name}"></a>
                                    </li>
                                </th:block>
                                
                                <th:block th:if="${locations == null}">
                                    <li><a class="dropdown-item" href="#" data-value="Đà Nẵng">Đà Nẵng</a></li>
                                    <li><a class="dropdown-item" href="#" data-value="Hà Nội">Hà Nội</a></li>
                                    <li><a class="dropdown-item" href="#" data-value="TP Hồ Chí Minh">TP. Hồ Chí Minh</a></li>
                                </th:block>
                            </ul>
                        
                            <input type="hidden" name="city" id="locationValue" required="required">
                        </div>

                        <div class="ct-field-divider"></div>

                        <div class="ct-field">
                            <label class="ct-field__label" for="dateFrom">
                                <i class="fa-regular fa-calendar-plus"></i> Nhận xe
                            </label>
                            <input class="ct-field__input" type="date" id="dateFrom" name="dateFrom" required="required"/>
                        </div>

                        <div class="ct-field-divider"></div>

                        <div class="ct-field">
                            <label class="ct-field__label" for="dateTo">
                                <i class="fa-regular fa-calendar-check"></i> Trả xe
                            </label>
                            <input class="ct-field__input" type="date" id="dateTo" name="dateTo" required="required"/>
                        </div>

                        <button type="submit" class="ct-search-btn">
                            <i class="fa-solid fa-magnifying-glass"></i> Tìm xe ngay
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

</body>
</html>
