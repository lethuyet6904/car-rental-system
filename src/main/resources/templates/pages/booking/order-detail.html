<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chi Tiết Đơn Hàng - Carto', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/customer.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="padding-top: 100px !important;">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm rounded-3 alert-dismissible fade show mb-4" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm rounded-3 alert-dismissible fade show mb-4" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
                
                <div class="card-header border-0 bg-white p-4 pt-5 pb-3">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <span class="text-primary fw-semibold small text-uppercase tracking-wider">Hồ sơ giao dịch</span>
                            <h1 class="h3 fw-bold text-dark mb-1" style="font-family: 'Outfit', sans-serif;">
                                Chi tiết đơn hàng <span class="text-secondary" th:text="'#' + ${order.orderId}"></span>
                            </h1>
                        </div>
                        
                        <div>
                            <span class="badge rounded-pill bg-warning bg-opacity-10 text-warning px-3 py-2 fw-semibold fs-7 border border-warning border-opacity-10" 
                                  th:if="${order.status.name() == 'Pending'}">
                                <i class="fa-solid fa-hourglass-half me-1.5 small"></i> Chờ chủ xe duyệt
                            </span>
                            <span class="badge rounded-pill bg-info bg-opacity-10 text-info px-3 py-2 fw-semibold fs-7 border border-info border-opacity-10" 
                                  th:if="${order.status.name() == 'Confirmed'}">
                                <i class="fa-solid fa-circle-check me-1.5 small"></i> Đã xác nhận
                            </span>
                            <span class="badge rounded-pill bg-success bg-opacity-10 text-success px-3 py-2 fw-semibold fs-7 border border-success border-opacity-10" 
                                  th:if="${order.status.name() == 'Completed'}">
                                <i class="fa-solid fa-square-check me-1.5 small"></i> Hoàn thành
                            </span>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 pt-2">
                    
                    <div class="row g-0 border-bottom py-3">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Mã đơn hàng</span>
                        </div>
                        <div class="col-sm-9 text-dark fw-bold font-monospace" th:text="'#' + ${order.orderId}"></div>
                    </div>

                    <div class="row g-0 border-bottom py-3">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Khách hàng</span>
                        </div>
                        <div class="col-sm-9 text-dark fw-medium" th:text="${order.customer.fullName}"></div>
                    </div>

                    <div class="row g-0 border-bottom py-3">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Phương tiện thuê</span>
                        </div>
                        <div class="col-sm-9">
                            <span class="text-dark fw-bold fs-6" th:text="${order.car.modelName}"></span>
                            <span class="badge bg-light text-secondary border font-monospace ms-2 px-2 py-1" th:text="${order.car.licensePlate}"></span>
                        </div>
                    </div>

                    <div class="row g-0 border-bottom py-3">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Thời gian nhận</span>
                        </div>
                        <div class="col-sm-9 text-dark fw-medium">
                            <i class="fa-regular fa-calendar me-1.5 text-muted"></i>
                            <span class="fw-bold" th:text="${#temporals.format(order.pickupDate, 'dd/MM/yyyy')}"></span>
                            <span class="text-muted ms-1 font-monospace" th:text="${order.pickupTime}"></span>
                        </div>
                    </div>

                    <div class="row g-0 border-bottom py-3">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Thời gian trả</span>
                        </div>
                        <div class="col-sm-9 text-dark fw-medium">
                            <i class="fa-regular fa-calendar-xmark me-1.5 text-muted"></i>
                            <span class="fw-bold" th:text="${#temporals.format(order.returnDate, 'dd/MM/yyyy')}"></span>
                            <span class="text-muted ms-1 font-monospace" th:text="${order.returnTime}"></span>
                        </div>
                    </div>

                    <div class="row g-0 border-bottom py-3 bg-light bg-opacity-20 mx-n4 px-4">
                        <div class="col-sm-3">
                            <span class="fw-semibold text-secondary small text-uppercase">Số tiền đặt cọc</span>
                        </div>
                        <div class="col-sm-9 text-secondary fw-semibold" th:text="${#numbers.formatInteger(order.depositAmount, 0, 'COMMA')} + ' VNĐ'"></div>
                    </div>

                    <div class="row g-0 border-bottom-0 py-3.5 bg-light bg-opacity-50 mx-n4 px-4 align-items-center">
                        <div class="col-sm-3">
                            <span class="fw-bold text-dark small text-uppercase">Tổng thanh toán</span>
                        </div>
                        <div class="col-sm-9 text-primary fw-bold fs-4" style="font-family: 'Outfit', sans-serif;" 
                             th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + ' VNĐ'"></div>
                    </div>

                </div>

                <div class="card-footer bg-white border-top-0 p-4 pb-5 d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <a th:href="@{/booking/my-orders}" class="btn btn-outline-dark rounded-3 px-3 py-2 fw-medium border shadow-none transition-all">
                        <i class="fa-solid fa-arrow-left me-1.5 small"></i> Đơn hàng của tôi
                    </a>
                    
                    <a th:if="${order.status.name() == 'Confirmed'}"
                       th:href="@{/payment/checkout/{id}(id=${order.orderId})}"
                       class="btn btn-dark rounded-3 px-4 py-2 fw-semibold shadow-sm transition-all hover-bg-primary">
                        <i class="fa-solid fa-credit-card me-1.5 small"></i> Tiến hành thanh toán
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
