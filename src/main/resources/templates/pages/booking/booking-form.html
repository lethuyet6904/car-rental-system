<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt xe - Carto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .booking-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .car-info { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .price-large { font-size: 28px; font-weight: bold; color: #0d6efd; }
        .btn-book { background: #0d6efd; color: white; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 12px; width: 100%; }
        .btn-book:hover { background: #0b5ed7; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="booking-card">
                <h2 class="mb-4">Xác nhận đặt xe</h2>
                
                <!-- Thông tin xe - KHÔNG dùng brand, chỉ dùng thuộc tính của Car -->
                <div class="car-info">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h4 th:text="${car.modelName}">Tên xe</h4>
                            <p class="mb-1"><i class="fas fa-car"></i> <span th:text="${car.brand != null ? car.brand.brandName : 'Đang cập nhật'}"></span></p>
                            <p class="mb-0"><i class="fas fa-location-dot"></i> <span th:text="${car.pickupLocation}"></span></p>
                            <p class="mb-0 mt-2"><i class="fas fa-chair"></i> <span th:text="${car.seats}"></span> chỗ</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <div class="price-large" th:text="${#numbers.formatInteger(car.pricePerDay, 0, 'COMMA') + 'đ'}">0đ</div>
                            <small class="text-muted">/ngày</small>
                        </div>
                    </div>
                </div>
                
                <!-- Form đặt xe -->
                <form th:action="@{/booking/create}" method="post">
                    <input type="hidden" name="carId" th:value="${car.carId}">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Ngày nhận xe</label>
                            <input type="date" name="pickupDate" class="form-control mb-2" th:value="${pickupDate}" required>
                            <input type="time" name="pickupTime" class="form-control" th:value="${pickupTime}" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Ngày trả xe</label>
                            <input type="date" name="returnDate" class="form-control mb-2" th:value="${returnDate}" required>
                            <input type="time" name="returnTime" class="form-control" th:value="${returnTime}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phương thức nhận xe</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="pickupMethod" value="SelfPickup" id="selfPickup" checked>
                            <label class="form-check-label" for="selfPickup">
                                Tôi tự đến lấy xe <span class="badge bg-success">Miễn phí</span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="pickupMethod" value="Delivery" id="delivery">
                            <label class="form-check-label" for="delivery">
                                Giao xe tận nơi <span class="badge bg-warning">Có phí</span>
                            </label>
                        </div>
                        <input type="text" name="deliveryAddress" class="form-control mt-2" placeholder="Nhập địa chỉ giao xe" style="display: none;">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ghi chú</label>
                        <textarea name="note" class="form-control" rows="3" placeholder="Ghi chú thêm cho chủ xe..."></textarea>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <span><strong>Tạm tính:</strong></span>
                        <span th:text="${#numbers.formatInteger(car.pricePerDay, 0, 'COMMA') + 'đ'} + '/ngày'"></span>
                    </div>
                    
                    <button type="submit" class="btn-book">
                        <i class="fas fa-check-circle"></i> Xác nhận đặt xe
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('input[name="pickupMethod"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const addressInput = document.querySelector('input[name="deliveryAddress"]');
            addressInput.style.display = this.value === 'Delivery' ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
