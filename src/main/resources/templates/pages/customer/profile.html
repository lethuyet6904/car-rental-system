<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Thông tin cá nhân - Carto', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/customer.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="padding-top: 100px !important;">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
                
                <div class="card-header border-0 bg-white p-4 pt-5 pb-2">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <span class="text-primary fw-semibold small text-uppercase tracking-wider">Tài khoản thành viên</span>
                            <h1 class="h3 fw-bold text-dark mb-1" style="font-family: 'Outfit', sans-serif;">
                                <i class="fa-solid fa-user-gear me-2 text-secondary fs-4"></i>Thông tin cá nhân
                            </h1>
                        </div>
                        <button id="editBtn" class="btn btn-light border rounded-3 px-3 py-2 fw-medium shadow-sm" onclick="toggleEdit()">
                            <i class="fa-solid fa-pen-to-square me-1.5 small text-muted"></i> Chỉnh sửa
                        </button>
                    </div>
                </div>

                <div class="card-body px-4 py-2">
                    <form id="profileForm" th:action="@{/customer/profile/update}" method="post">
                        
                        <div class="row align-items-center border-bottom py-3.5 mx-0">
                            <div class="col-sm-3 ps-0 mb-1 mb-sm-0">
                                <span class="fw-semibold text-secondary small text-uppercase">Họ và tên</span>
                            </div>
                            <div class="col-sm-9 pe-0">
                                <input type="text" class="form-control border-0 bg-transparent px-0 fw-medium text-dark fs-6 shadow-none form-control-plaintext transition-all" 
                                       id="fullName" name="fullName" th:value="${user.fullName}" readonly>
                            </div>
                        </div>

                        <div class="row align-items-center border-bottom py-3.5 mx-0">
                            <div class="col-sm-3 ps-0 mb-1 mb-sm-0">
                                <span class="fw-semibold text-secondary small text-uppercase">Số điện thoại</span>
                            </div>
                            <div class="col-sm-9 pe-0">
                                <input type="text" class="form-control border-0 bg-transparent px-0 fw-medium text-muted fs-6 shadow-none form-control-plaintext" 
                                       th:value="${user.phone}" readonly>
                            </div>
                        </div>

                        <div class="row align-items-center border-bottom py-3.5 mx-0">
                            <div class="col-sm-3 ps-0 mb-1 mb-sm-0">
                                <span class="fw-semibold text-secondary small text-uppercase">Email</span>
                            </div>
                            <div class="col-sm-9 pe-0">
                                <input type="email" class="form-control border-0 bg-transparent px-0 fw-medium text-dark fs-6 shadow-none form-control-plaintext transition-all" 
                                       id="email" name="email" th:value="${user.email}" readonly>
                            </div>
                        </div>

                        <div class="row align-items-center border-bottom-0 py-3.5 mx-0">
                            <div class="col-sm-3 ps-0 mb-1 mb-sm-0">
                                <span class="fw-semibold text-secondary small text-uppercase">Địa chỉ</span>
                            </div>
                            <div class="col-sm-9 pe-0">
                                <input type="text" class="form-control border-0 bg-transparent px-0 fw-medium text-dark fs-6 shadow-none form-control-plaintext transition-all" 
                                       id="address" name="address" th:value="${user.address}" readonly>
                            </div>
                        </div>

                        <div class="p-4 rounded-3 text-end bg-light my-3 border" id="actionButtons" style="display: none;">
                            <button type="button" class="btn btn-outline-secondary rounded-3 px-3.5 py-2 fw-medium border me-2" onclick="toggleEdit()">
                                Hủy bỏ
                            </button>
                            <button type="submit" class="btn btn-dark rounded-3 px-4 py-2 fw-medium shadow-sm">
                                <i class="fa-solid fa-cloud-arrow-up me-1.5 small"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-white border-top-0 p-4 pt-2 pb-5">
                    <hr class="my-3 text-muted opacity-20" />
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <a th:href="@{/verification/identity}" class="btn btn-outline-primary rounded-3 px-3 py-2 fw-medium transition-all">
                                <i class="fa-solid fa-id-card me-1.5 small"></i> Định danh tài khoản 
                            </a>
                        </div>
                        
                        <div th:if="${user != null}" class="text-end">
                            <span class="badge rounded-pill bg-success bg-opacity-10 text-success px-3 py-2.5 fw-semibold fs-7 border border-success border-opacity-10">
                                <i class="fa-solid fa-circle-check me-1.5 small"></i> Đã định danh thành công
                            </span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function toggleEdit() {
        const readonly = document.getElementById("fullName").readOnly;
        const targetIds = ["fullName", "email", "address"];
        
        // Giữ nguyên logic đóng/mở thuộc tính chỉnh sửa
        document.getElementById("fullName").readOnly = !readonly;
        document.getElementById("email").readOnly = !readonly;
        document.getElementById("address").readOnly = !readonly;

        // Thêm hiệu ứng UI: Chuyển đổi qua lại giữa văn bản phẳng và hộp nhập liệu chuẩn khi gõ
        targetIds.forEach(id => {
            const inputEl = document.getElementById(id);
            if (readonly) {
                inputEl.classList.remove("border-0", "bg-transparent", "px-0", "form-control-plaintext");
            } else {
                inputEl.classList.add("border-0", "bg-transparent", "px-0", "form-control-plaintext");
            }
        });

        // Toggle nút Chỉnh sửa và cụm phím lưu/hủy
        document.getElementById("editBtn").classList.toggle("d-none");
        const actionDiv = document.getElementById("actionButtons");
        actionDiv.style.display = readonly ? "block" : "none";
        
        if(readonly) {
            document.getElementById("fullName").focus();
        }
    }
</script>

</body>
</html>
