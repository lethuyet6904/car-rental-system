<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đổi mật khẩu', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/profile.css}" />
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="ct-profile-page">
        <div class="container">
            <div class="row g-4">

                <!-- Sidebar -->
                <div class="col-lg-3 col-md-4">
                    <div class="ct-profile-sidebar">
                        <div class="ct-avatar-wrap">
                            <div th:if="${user.avatar != null}">
                                <img th:src="${user.avatar}" alt="Avatar" class="ct-avatar-img" />
                            </div>
                            <div th:if="${user.avatar == null}" class="ct-avatar-circle"
                                th:text="${#strings.substring(user.fullName, 0, 1).toUpperCase()}">U</div>
                            <div>
                                <div class="ct-avatar-name" th:text="${user.fullName}">Nguyễn Văn A</div>
                                <div class="ct-avatar-phone" th:text="${user.phone}">0901234567</div>
                            </div>
                            <div th:if="${identityStatus != null and identityStatus.name() == 'Approved'}"
                                class="ct-verify-badge verified w-100">
                                <i class="fa-solid fa-circle-check"></i> Đã xác minh
                            </div>
                            <div th:if="${identityStatus != null and identityStatus.name() == 'Pending'}"
                                class="ct-verify-badge pending w-100">
                                <i class="fa-solid fa-clock"></i> Chờ xác minh
                            </div>
                            <div th:if="${identityStatus == null or identityStatus.name() == 'Rejected'}"
                                class="ct-verify-badge unverified w-100">
                                <i class="fa-solid fa-circle-xmark"></i> Chưa xác minh
                            </div>
                        </div>
                        <ul class="ct-profile-nav">
                            <li><a th:href="@{/customer/profile}"><i class="fa-solid fa-user"></i> Hồ sơ cá nhân</a>
                            </li>
                            <li><a th:href="@{/customer/change-password}" class="active"><i
                                        class="fa-solid fa-lock"></i> Đổi mật khẩu</a></li>
                            <li><a th:href="@{/booking/my-orders}"><i class="fa-solid fa-file-contract"></i> Đơn thuê
                                    của tôi</a></li>
                            <li th:if="${identityStatus == null or identityStatus.name() == 'Rejected'}">
                                <a th:href="@{/verification/cccd}"><i class="fa-solid fa-id-card"></i> Xác minh CCCD</a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Main -->
                <div class="col-lg-9 col-md-8">

                    <div th:if="${success}" class="ct-alert-success mb-3">
                        <i class="fa-solid fa-circle-check"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <div th:if="${error}" class="ct-alert-error mb-3">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <div class="ct-profile-card">
                        <div class="ct-profile-card__header">
                            <div>
                                <h2 class="ct-profile-card__title">
                                    <i class="fa-solid fa-lock me-2 text-secondary" style="font-size:1.1rem"></i>
                                    Đổi mật khẩu
                                </h2>
                                <p class="ct-profile-card__subtitle">Thay đổi mật khẩu đăng nhập của bạn</p>
                            </div>
                        </div>

                        <div class="ct-profile-card__body">
                            <form th:action="@{/customer/change-password}" method="post">

                                <div class="ct-info-row">
                                    <label class="ct-info-row__label" for="currentPassword">Mật khẩu hiện tại</label>
                                    <div style="position:relative">
                                        <input id="currentPassword" name="currentPassword" type="password"
                                            class="ct-profile-input" placeholder="Nhập mật khẩu hiện tại" required
                                            style="padding-right:44px" />
                                        <button type="button" class="toggle-pw"
                                            onclick="togglePw('currentPassword', this)"
                                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ct-text-muted);padding:0">
                                            <i class="fa-solid fa-eye" style="font-size:0.9rem"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="ct-info-row">
                                    <label class="ct-info-row__label" for="newPassword">Mật khẩu mới</label>
                                    <div style="position:relative">
                                        <input id="newPassword" name="newPassword" type="password"
                                            class="ct-profile-input"
                                            placeholder="Ít nhất 6 ký tự, gồm chữ hoa, thường và số" required
                                            style="padding-right:44px" />
                                        <button type="button" class="toggle-pw" onclick="togglePw('newPassword', this)"
                                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ct-text-muted);padding:0">
                                            <i class="fa-solid fa-eye" style="font-size:0.9rem"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="ct-info-row">
                                    <label class="ct-info-row__label" for="confirmPassword">Xác nhận mật khẩu</label>
                                    <div style="position:relative">
                                        <input id="confirmPassword" name="confirmPassword" type="password"
                                            class="ct-profile-input" placeholder="Nhập lại mật khẩu mới" required
                                            style="padding-right:44px" />
                                        <button type="button" class="toggle-pw"
                                            onclick="togglePw('confirmPassword', this)"
                                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ct-text-muted);padding:0">
                                            <i class="fa-solid fa-eye" style="font-size:0.9rem"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="ct-action-bar">
                                    <a th:href="@{/customer/profile}" class="ct-btn-cancel"
                                        style="text-decoration:none">
                                        <i class="fa-solid fa-xmark"></i> Hủy bỏ
                                    </a>
                                    <button type="submit" class="ct-btn-save">
                                        <i class="fa-solid fa-lock"></i> Đổi mật khẩu
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>

</html>
