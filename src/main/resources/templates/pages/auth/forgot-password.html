<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quên mật khẩu', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/auth.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="ct-auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="ct-auth-card">

                    <!-- Back link -->
                    <a th:href="@{/auth/login}" class="ct-auth-back">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
                    </a>

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <span class="ct-auth-badge">
                            <i class="fa-solid fa-rotate-left"></i> Khôi phục tài khoản
                        </span>
                        <h1 class="ct-auth-title">Quên Mật Khẩu?</h1>
                        <p class="ct-auth-subtitle" th:text="${otpSent} ? 'Nhập mã OTP đã được gửi đến email của bạn' : 'Nhập email để nhận mã OTP xác thực'">
                            Nhập email để nhận mã OTP xác thực
                        </p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${error}" class="ct-alert ct-alert--danger">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${success}" class="ct-alert ct-alert--success">
                        <i class="fa-solid fa-circle-check"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <!-- ── BƯỚC 1: Nhập email → Gửi OTP ── -->
                    <div th:if="${otpSent == null or !otpSent}">
                        <form th:action="@{/auth/forgot-password/send-otp}" method="post">
                            <div class="mb-4">
                                <label class="ct-form-label">
                                    <i class="fa-solid fa-envelope"></i> Email đã đăng ký
                                </label>
                                <input type="email"
                                       class="ct-form-control"
                                       name="email"
                                       th:value="${email}"
                                       placeholder="example@email.com"
                                       required>
                            </div>
                            <button type="submit" class="ct-auth-btn">
                                <i class="fa-solid fa-paper-plane"></i> Gửi mã OTP
                            </button>
                        </form>

                        <p class="ct-auth-footer-text">
                            Nhớ mật khẩu rồi?
                            <a th:href="@{/auth/login}" class="ct-auth-link">Đăng nhập ngay</a>
                        </p>
                    </div>

                    <!-- ── BƯỚC 2: Nhập OTP + mật khẩu mới ── -->
                    <div th:if="${otpSent}">

                        <div class="ct-otp-hint">
                            <i class="fa-solid fa-envelope-open-text"></i>
                            Mã OTP đã gửi đến <strong th:text="${email}">example@email.com</strong>
                        </div>

                        <form th:action="@{/auth/forgot-password}" method="post">
                            <input type="hidden" name="email" th:value="${email}">

                            <div class="mb-3">
                                <label class="ct-form-label">
                                    <i class="fa-solid fa-hashtag"></i> Mã OTP (6 số)
                                </label>
                                <input type="text"
                                       class="ct-form-control ct-otp-input"
                                       name="otp"
                                       placeholder="_ _ _ _ _ _"
                                       maxlength="6"
                                       inputmode="numeric"
                                       pattern="[0-9]{6}"
                                       autocomplete="one-time-code"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="ct-form-label">
                                    <i class="fa-solid fa-key"></i> Mật khẩu mới
                                </label>
                                <div class="ct-input-group">
                                    <input type="password"
                                           class="ct-form-control"
                                           id="newPasswordInput"
                                           name="newPassword"
                                           placeholder="Ít nhất 6 ký tự, gồm chữ hoa, thường và số"
                                           required>
                                    <button type="button" class="ct-input-toggle" onclick="togglePassword('newPasswordInput', this)">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="ct-form-label">
                                    <i class="fa-solid fa-lock"></i> Xác nhận mật khẩu mới
                                </label>
                                <div class="ct-input-group">
                                    <input type="password"
                                           class="ct-form-control"
                                           id="confirmPasswordInput"
                                           name="confirmPassword"
                                           placeholder="Nhập lại mật khẩu mới"
                                           required>
                                    <button type="button" class="ct-input-toggle" onclick="togglePassword('confirmPasswordInput', this)">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="ct-auth-btn ct-auth-btn--warning">
                                <i class="fa-solid fa-lock"></i> Cập nhật mật khẩu
                            </button>
                        </form>

                        <p class="ct-auth-footer-text">
                            Không nhận được mã?
                            <a th:href="@{/auth/forgot-password}" class="ct-auth-link">Gửi lại OTP</a>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }

    // Chỉ cho nhập số trong ô OTP
    const otpInput = document.querySelector('.ct-otp-input');
    if (otpInput) {
        otpInput.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    }
</script>
</body>
</html>
