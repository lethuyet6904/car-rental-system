<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/auth.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="ct-auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <div class="ct-auth-card">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <span class="ct-auth-badge">
                            <i class="fa-solid fa-lock-open"></i> Tài khoản của bạn
                        </span>
                        <h1 class="ct-auth-title">Đăng nhập</h1>
                        <p class="ct-auth-subtitle">Chào mừng bạn quay trở lại Carto!</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${error}" class="ct-alert ct-alert--danger">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${param.logout}" class="ct-alert ct-alert--success">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Bạn đã đăng xuất thành công.</span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/auth/login}" method="post" th:object="${loginRequest}">

                        <div class="mb-3">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-mobile-screen-button"></i> Số điện thoại
                            </label>
                            <input type="text"
                                   class="ct-form-control"
                                   th:field="*{phone}"
                                   placeholder="0xxxxxxxxx"
                                   required>
                        </div>

                        <div class="mb-1">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-key"></i> Mật khẩu
                            </label>
                            <div class="ct-input-group">
                                <input type="password"
                                       class="ct-form-control"
                                       id="passwordInput"
                                       th:field="*{password}"
                                       placeholder="Nhập mật khẩu"
                                       required>
                                <button type="button" class="ct-input-toggle" onclick="togglePassword('passwordInput', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mb-4 mt-2">
                            <a th:href="@{/auth/forgot-password}" class="ct-auth-link--muted ct-auth-link" style="font-size:0.82rem;">Quên mật khẩu?</a>
                        </div>

                        <button type="submit" class="ct-auth-btn">
                            <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
                        </button>
                    </form>

                    <!-- Footer link -->
                    <p class="ct-auth-footer-text">
                        Chưa có tài khoản?
                        <a th:href="@{/auth/register}" class="ct-auth-link">Đăng ký ngay</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }
</script>
</body>
</html>
