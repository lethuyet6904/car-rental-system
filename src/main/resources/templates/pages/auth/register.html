<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký tài khoản', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/auth.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="ct-auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="ct-auth-card">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <span class="ct-auth-badge">
                            <i class="fa-solid fa-user-plus"></i> Gia nhập Carto
                        </span>
                        <h1 class="ct-auth-title">Đăng Ký Tài Khoản</h1>
                        <p class="ct-auth-subtitle">Miễn phí – Chỉ mất 1 phút để bắt đầu</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${success}" class="ct-alert ct-alert--success">
                        <i class="fa-solid fa-circle-check"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <div th:if="${error}" class="ct-alert ct-alert--danger">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">

                        <!-- Hiển thị lỗi validation -->
                        <div th:if="${#fields.hasErrors('*')}" class="ct-alert ct-alert--danger">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <div>
                                <p th:each="err : ${#fields.errors('*')}" th:text="${err}" style="margin:0 0 4px 0;"></p>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-user"></i> Họ và tên
                            </label>
                            <input type="text"
                                   class="ct-form-control"
                                   th:field="*{fullName}"
                                   placeholder="Nguyễn Văn A"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-envelope"></i> Email
                            </label>
                            <input type="email"
                                   class="ct-form-control"
                                   th:field="*{email}"
                                   placeholder="example@email.com"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-mobile-screen-button"></i> Số điện thoại
                            </label>
                            <input type="text"
                                   class="ct-form-control"
                                   th:field="*{phone}"
                                   placeholder="0xxxxxxxxx"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-key"></i> Mật khẩu
                            </label>
                            <div class="ct-input-group">
                                <input type="password"
                                       class="ct-form-control"
                                       id="passwordInput"
                                       th:field="*{password}"
                                       placeholder="Ít nhất 6 ký tự, gồm chữ hoa, thường và số"
                                       required>
                                <button type="button" class="ct-input-toggle" onclick="togglePassword('passwordInput', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="ct-form-label">
                                <i class="fa-solid fa-lock"></i> Xác nhận mật khẩu
                            </label>
                            <div class="ct-input-group">
                                <input type="password"
                                       class="ct-form-control"
                                       id="confirmPasswordInput"
                                       th:field="*{confirmPassword}"
                                       placeholder="Nhập lại mật khẩu"
                                       required>
                                <button type="button" class="ct-input-toggle" onclick="togglePassword('confirmPasswordInput', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="ct-auth-btn">
                            <i class="fa-solid fa-user-check"></i> Tạo tài khoản
                        </button>
                    </form>
                    <!-- Footer link -->
                    <p class="ct-auth-footer-text">
                        Đã có tài khoản?
                        <a th:href="@{/auth/login}" class="ct-auth-link">Đăng nhập</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }
</script>
</body>
</html>
