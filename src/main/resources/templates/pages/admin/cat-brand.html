<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Quản lý hãng xe')}"></head>
<body>
<div class="admin-wrapper">

  <th:block th:replace="~{fragments/admin-layout :: sidebar('cat-brand')}"></th:block>

  <div class="admin-body">
    <th:block th:replace="~{fragments/admin-layout :: topbar(
        'Quản lý hãng xe',
        'Admin / Danh mục / <span>Hãng xe</span>')}">
    </th:block>

    <div class="admin-content">

      <div th:if="${successMessage}" class="alert-success-admin">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
      </div>

      <div class="admin-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;color:#111827">Danh sách hãng xe</div>
          <div style="display:flex;gap:8px;align-items:center">
			<form th:action="@{/admin/categories/brands}" method="get" class="filter-bar"
			      style="margin-bottom:0">
			  <input type="text" name="keyword" th:value="${keyword}"
			         placeholder="Tìm theo tên hãng xe…"/>
			  <button type="submit" class="btn-search">
			    <i class="bi bi-search"></i> Tìm kiếm
			  </button>
			  
			</form>
            <button type="button" class="btn-admin-primary"
                    data-bs-toggle="modal" data-bs-target="#addBrandModal">
              <i class="bi bi-plus-lg"></i> Thêm hãng xe
            </button>
          </div>
        </div>

        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:40px">STT</th>
              <th style="width:60px">Logo</th>
              <th>Hãng xe</th>
              <th>Số xe</th>
              <th>Trạng thái</th>
              <th style="width:90px"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(brands)}">
              <td colspan="6" class="empty-state">Chưa có hãng xe nào</td>
            </tr>
            <tr th:each="b, iter : ${brands}">
              <td style="color:#9ca3af" th:text="${iter.index + 1}"></td>
              <td>
				<img th:src="@{'/uploads/brands/' + ${b.logoUrl}}" 
				     alt="logo" 
				     style="width: 45px; height: 45px; object-fit: contain;" 
				     onerror="this.style.display='none'" />
              </td>
              <td style="font-weight:500" th:text="${b.name}"></td>
              <td th:text="${b.carCount}"></td>
              <td>
                <span th:class="${b.status == 'Active' ? 'badge-approved' : 'badge-none'}"
                      th:text="${b.status == 'Active' ? 'Đang dùng' : 'Ẩn'}">
                </span>
              </td>
              <td>
                <div style="display:flex;gap:6px">
                  <button type="button" class="btn btn-sm btn-outline-secondary"
                          data-bs-toggle="modal" data-bs-target="#editBrandModal"
                          th:data-id="${b.id}" th:data-name="${b.name}"
                          th:data-status="${b.status}"
						  th:data-logo="${b.logoUrl}"
                          onclick="fillEditBrandModal(this)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          data-bs-toggle="modal" data-bs-target="#deleteBrandModal"
                          th:data-id="${b.id}" th:data-name="${b.name}"
                          onclick="fillDeleteBrandModal(this)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Thêm hãng xe -->
<div class="modal fade" id="addBrandModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form th:action="@{/admin/categories/brands/add}" method="post" enctype="multipart/form-data">
        <div class="modal-header">
          <h6 class="modal-title">Thêm hãng xe</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500">
              Tên hãng xe <span style="color:#ef4444">*</span>
            </label>
            <input type="text" name="name" class="form-control form-control-sm"
                   placeholder="Ví dụ: Kia, Mazda…" required/>
          </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500">Logo</label>
            <div class="img-box" style="height:70px;cursor:pointer;border-style:dashed"
                 onclick="document.getElementById('logoInput').click()">
              <div style="text-align:center">
                <i class="bi bi-upload" style="font-size:18px;display:block;margin-bottom:4px"></i>
                Tải ảnh lên
              </div>
            </div>
            <input type="file" id="logoInput" name="logo"
                   accept="image/*" style="display:none"/>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm"
                  data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary btn-sm">Thêm</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Chỉnh sửa hãng xe -->
<div class="modal fade" id="editBrandModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="editBrandForm" method="post" enctype="multipart/form-data">
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="modal-header">
          <h6 class="modal-title">Chỉnh sửa hãng xe</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500">
              Tên hãng xe <span style="color:#ef4444">*</span>
            </label>
            <input type="text" id="editBrandName" name="name"
                   class="form-control form-control-sm" required/>
          </div>
		  <div class="mb-3">
		              <label class="form-label" style="font-size:13px;font-weight:500">Logo</label>
					  <div style="margin-bottom: 10px; text-align: center;">
					      <img id="editLogoPreview" src="" alt="preview" 
					           style="max-height: 80px; display: none; object-fit: contain; border: 1px solid #e5e7eb; border-radius: 4px; padding: 4px;" />
					    </div>
		              <div class="img-box" style="height:70px;cursor:pointer;border-style:dashed"
		                   onclick="document.getElementById('editLogoInput').click()">
		                <div style="text-align:center">
		                  <i class="bi bi-upload" style="font-size:18px;display:block;margin-bottom:4px"></i>
		                  Tải ảnh mới
		                </div>
		              </div>
		              <input type="file" id="editLogoInput" name="logo"
		                     accept="image/*" style="display:none" onchange="previewEditLogo(event)"/>
		            </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500">Trạng thái</label>
            <select id="editBrandStatus" name="status" class="form-select form-select-sm">
              <option value="Active">Đang dùng</option>
              <option value="Hidden">Ẩn</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm"
                  data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary btn-sm">Lưu</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Xóa hãng xe -->
<div class="modal fade" id="deleteBrandModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="deleteBrandForm" method="post">
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="modal-header">
          <h6 class="modal-title">Xác nhận xóa hãng xe</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="font-size:13px;color:#374151;text-align:center;padding:20px">
          Bạn có chắc muốn xóa hãng xe
          <strong><span id="deleteBrandName"></span></strong> không?
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary btn-sm"
                  data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
<script>
	function fillEditBrandModal(btn) {
	  // Đổ data text
	  document.getElementById('editBrandForm').action = '/admin/categories/brands/' + btn.dataset.id + '/edit';
	  document.getElementById('editBrandName').value   = btn.dataset.name;
	  document.getElementById('editBrandStatus').value = btn.dataset.status;

	  // Xử lý hiển thị ảnh hiện tại
	  const logoUrl = btn.dataset.logo;
	  const previewImg = document.getElementById('editLogoPreview');
	  
	  // Nếu có ảnh thì ghép chuỗi trỏ ra thư mục uploads
	  if (logoUrl && logoUrl !== 'null' && logoUrl.trim() !== '') {
	    previewImg.src = '/uploads/brands/' + logoUrl;
	    previewImg.style.display = 'inline-block';
	  } else {
	    // Không có ảnh thì ẩn đi
	    previewImg.src = '';
	    previewImg.style.display = 'none';
	  }
	  
	  // Reset input file để tránh lưu cache file cũ vừa chọn
	  document.getElementById('editLogoInput').value = '';
	}

	// Hàm đọc file ngay dưới trình duyệt và hiển thị preview
	function previewEditLogo(event) {
	  const file = event.target.files[0];
	  if (file) {
	    const reader = new FileReader();
	    reader.onload = function(e) {
	      const previewImg = document.getElementById('editLogoPreview');
	      previewImg.src = e.target.result;
	      previewImg.style.display = 'inline-block';
	    }
	    reader.readAsDataURL(file);
	  }
	}
function fillDeleteBrandModal(btn) {
  document.getElementById('deleteBrandForm').action =
    '/admin/categories/brands/' + btn.dataset.id + '/delete';
  document.getElementById('deleteBrandName').textContent = btn.dataset.name;
}
</script>
</body>
</html>
