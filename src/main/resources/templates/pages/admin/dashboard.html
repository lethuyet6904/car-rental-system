<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Dashboard')}"></head>
<body>
<div class="admin-wrapper">

  <th:block th:replace="~{fragments/admin-layout :: sidebar('dashboard')}"></th:block>

  <div class="admin-body">
    <th:block th:replace="~{fragments/admin-layout :: topbar(
        'Dashboard',
        'Admin / <span>Dashboard</span>')}">
    </th:block>

    <div class="admin-content">

      <!-- Stat cards -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#ede9fe;
                      display:flex;align-items:center;justify-content:center;font-size:20px">👥</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng người dùng</div>
            <div style="font-size:22px;font-weight:700;color:#111827"
                 th:text="${totalUsers}">1,284</div>
          </div>
        </div>

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#dbeafe;
                      display:flex;align-items:center;justify-content:center;font-size:20px">🚗</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Chủ xe</div>
            <div style="font-size:22px;font-weight:700;color:#111827"
                 th:text="${totalOwners}">156</div>
          </div>
        </div>

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#fef3c7;
                      display:flex;align-items:center;justify-content:center;font-size:20px">⏳</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Xe chờ duyệt</div>
            <div style="font-size:22px;font-weight:700;color:#b45309"
                 th:text="${pendingCars}">8</div>
          </div>
        </div>

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#fef3c7;
                      display:flex;align-items:center;justify-content:center;font-size:20px">✅</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Yêu cầu chủ xe</div>
            <div style="font-size:22px;font-weight:700;color:#b45309"
                 th:text="${pendingOwners}">12</div>
          </div>
        </div>

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#dcfce7;
                      display:flex;align-items:center;justify-content:center;font-size:20px">📋</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng đơn thuê</div>
            <div style="font-size:22px;font-weight:700;color:#111827"
                 th:text="${totalOrders}">3,456</div>
          </div>
        </div>

        <div class="admin-card" style="display:flex;align-items:center;gap:16px">
          <div style="width:44px;height:44px;border-radius:10px;background:#dbeafe;
                      display:flex;align-items:center;justify-content:center;font-size:20px">🔑</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Đang thuê</div>
            <div style="font-size:22px;font-weight:700;color:#1d4ed8"
                 th:text="${activeOrders}">142</div>
          </div>
        </div>

      </div>

      <!-- Quick links -->
      <div class="admin-card">
        <div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#374151">
          Truy cập nhanh
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a th:href="@{/admin/users}"
             style="padding:8px 16px;border-radius:8px;background:#f3f4f6;
                    color:#374151;text-decoration:none;font-size:13px">
            👥 Danh sách người dùng
          </a>
          <a th:href="@{/admin/owner-requests}"
             style="padding:8px 16px;border-radius:8px;background:#fef3c7;
                    color:#92400e;text-decoration:none;font-size:13px">
            ✅ Duyệt yêu cầu chủ xe
            <span th:if="${pendingOwners > 0}"
                  style="background:#b45309;color:#fff;border-radius:999px;
                         padding:1px 7px;font-size:11px;margin-left:4px"
                  th:text="${pendingOwners}"></span>
          </a>
          <a th:href="@{/admin/cars}"
             style="padding:8px 16px;border-radius:8px;background:#fef3c7;
                    color:#92400e;text-decoration:none;font-size:13px">
            🚗 Duyệt xe đăng mới
            <span th:if="${pendingCars > 0}"
                  style="background:#b45309;color:#fff;border-radius:999px;
                         padding:1px 7px;font-size:11px;margin-left:4px"
                  th:text="${pendingCars}"></span>
          </a>
          <a th:href="@{/admin/orders}"
             style="padding:8px 16px;border-radius:8px;background:#f3f4f6;
                    color:#374151;text-decoration:none;font-size:13px">
            📋 Danh sách đơn thuê
          </a>
          <a th:href="@{/admin/complaints}"
             style="padding:8px 16px;border-radius:8px;background:#f3f4f6;
                    color:#374151;text-decoration:none;font-size:13px">
            ⚠️ Khiếu nại
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
