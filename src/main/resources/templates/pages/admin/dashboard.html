<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Dashboard')}"></head>
<body>
<div class="admin-wrapper">

  <th:block th:replace="~{fragments/admin-layout :: sidebar('dashboard')}"></th:block>

  <div class="admin-body">
    <th:block th:replace="~{fragments/admin-layout :: topbar(
        'Dashboard',
        'Admin / <span>Dashboard</span>')}">
    </th:block>

    <div class="admin-content">

      <!-- KPI Cards -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px">

        <a th:href="@{/admin/users}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;gap:14px;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:10px;background:#ede9fe;
                        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">👥</div>
            <div>
              <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng người dùng</div>
              <div style="font-size:22px;font-weight:700;color:#111827"
                   th:text="${stats.totalUsers}">0</div>
            </div>
          </div>
        </a>

        <a th:href="@{/admin/cars}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;gap:14px;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:10px;background:#dbeafe;
                        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🚗</div>
            <div>
              <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng xe hoạt động</div>
              <div style="font-size:22px;font-weight:700;color:#111827"
                   th:text="${stats.totalCars}">0</div>
            </div>
          </div>
        </a>

        <a th:href="@{/admin/orders}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;gap:14px;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:10px;background:#dcfce7;
                        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">📋</div>
            <div>
              <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng đơn thuê</div>
              <div style="font-size:22px;font-weight:700;color:#111827"
                   th:text="${stats.totalOrders}">0</div>
            </div>
          </div>
        </a>

        <div class="admin-card" style="display:flex;align-items:center;gap:14px">
          <div style="width:44px;height:44px;border-radius:10px;background:#fef9c3;
                      display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">💰</div>
          <div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:2px">Tổng doanh thu</div>
            <div style="font-size:16px;font-weight:700;color:#15803d"
                 th:text="${#numbers.formatDecimal(stats.totalRevenue,0,'COMMA',0,'POINT') + ' ₫'}">0 ₫</div>
          </div>
        </div>

      </div>

      <!-- Alert Badges -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px">

        <a th:href="@{/admin/complaints}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:38px;height:38px;border-radius:9px;background:#fee2e2;
                          display:flex;align-items:center;justify-content:center;font-size:16px">⚠️</div>
              <span style="font-size:13px;color:#374151">Khiếu nại chờ xử lý</span>
            </div>
            <span style="font-size:20px;font-weight:700"
                  th:class="${stats.pendingComplaints > 0 ? 'badge-rejected' : 'badge-approved'}"
                  th:text="${stats.pendingComplaints}">0</span>
          </div>
        </a>

        <a th:href="@{/admin/cars(status='Pending')}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:38px;height:38px;border-radius:9px;background:#fef3c7;
                          display:flex;align-items:center;justify-content:center;font-size:16px">🚗</div>
              <span style="font-size:13px;color:#374151">Xe chờ duyệt</span>
            </div>
            <span style="font-size:20px;font-weight:700"
                  th:class="${stats.pendingCars > 0 ? 'badge-pending' : 'badge-approved'}"
                  th:text="${stats.pendingCars}">0</span>
          </div>
        </a>

        <a th:href="@{/admin/owner-requests(status='Pending')}" style="text-decoration:none">
          <div class="admin-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:38px;height:38px;border-radius:9px;background:#ede9fe;
                          display:flex;align-items:center;justify-content:center;font-size:16px">✅</div>
              <span style="font-size:13px;color:#374151">Yêu cầu chủ xe</span>
            </div>
            <span style="font-size:20px;font-weight:700"
                  th:class="${stats.pendingOwners > 0 ? 'badge-pending' : 'badge-approved'}"
                  th:text="${stats.pendingOwners}">0</span>
          </div>
        </a>

      </div>

      <!-- Charts + Top lists -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

        <!-- Biểu đồ trạng thái đơn (Pie) -->
        <div class="admin-card">
          <div style="font-size:13px;font-weight:600;margin-bottom:16px;color:#374151">
            Trạng thái đơn thuê
          </div>
          <canvas id="orderStatusChart" height="200"></canvas>
        </div>

        <!-- Top 5 xe -->
        <div class="admin-card">
          <div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#374151">
            Top 5 xe được thuê nhiều nhất
          </div>
          <div th:if="${#lists.isEmpty(stats.topCars)}"
               style="font-size:12px;color:#9ca3af;font-style:italic">
            Chưa có dữ liệu
          </div>
          <div th:each="car, iter : ${stats.topCars}"
               style="display:flex;align-items:center;justify-content:space-between;
                      padding:8px 0;border-bottom:1px solid #f3f4f6">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:24px;height:24px;border-radius:50%;background:#ede9fe;
                           color:#5b21b6;display:flex;align-items:center;justify-content:center;
                           font-size:11px;font-weight:600"
                   th:text="${iter.index + 1}"></div>
              <div>
                <div style="font-size:13px;font-weight:500" th:text="${car.modelName}"></div>
                <div class="text-muted-small" th:text="${car.licensePlate}"></div>
              </div>
            </div>
            <span class="badge-approved" th:text="${car.orderCount + ' đơn'}"></span>
          </div>
        </div>

        <!-- Top 5 khu vực -->
        <div class="admin-card">
          <div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#374151">
            Top 5 khu vực hoạt động
          </div>
          <div th:if="${#lists.isEmpty(stats.topRegions)}"
               style="font-size:12px;color:#9ca3af;font-style:italic">
            Chưa có dữ liệu
          </div>
          <div th:each="region, iter : ${stats.topRegions}"
               style="display:flex;align-items:center;justify-content:space-between;
                      padding:8px 0;border-bottom:1px solid #f3f4f6">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:24px;height:24px;border-radius:50%;background:#dbeafe;
                           color:#1d4ed8;display:flex;align-items:center;justify-content:center;
                           font-size:11px;font-weight:600"
                   th:text="${iter.index + 1}"></div>
              <span style="font-size:13px" th:text="${region.regionName}"></span>
            </div>
            <span class="badge-none" th:text="${region.orderCount + ' đơn'}"></span>
          </div>
        </div>

        <!-- Thống kê nhanh đơn thuê -->
        <div class="admin-card">
          <div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#374151">
            Thống kê đơn thuê
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:13px;color:#6b7280">Đang thuê</span>
              <span class="badge-none" th:text="${stats.inProgressOrders}"></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:13px;color:#6b7280">Hoàn thành</span>
              <span class="badge-approved" th:text="${stats.completedOrders}"></span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:13px;color:#6b7280">Đã hủy</span>
              <span class="badge-rejected" th:text="${stats.cancelledOrders}"></span>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
  const completed  = [[${stats.completedOrders}]];
  const cancelled  = [[${stats.cancelledOrders}]];
  const inProgress = [[${stats.inProgressOrders}]];

  new Chart(document.getElementById('orderStatusChart'), {
    type: 'pie',
    data: {
      labels: ['Hoàn thành', 'Đã hủy', 'Đang thuê'],
      datasets: [{
        data: [completed, cancelled, inProgress],
        backgroundColor: ['#10b981', '#ef4444', '#7F77DD'],
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 12 } } }
      }
    }
  });
</script>
</body>
</html>
