<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Danh sách khiếu nại')}"></head>
<body>
<div class="admin-wrapper">

  <th:block th:replace="~{fragments/admin-layout :: sidebar('complaints')}"></th:block>

  <div class="admin-body">
    <th:block th:replace="~{fragments/admin-layout :: topbar(
        'Danh sách khiếu nại',
        'Admin / <span>Khiếu nại</span>')}">
    </th:block>

    <div class="admin-content">

      <div th:if="${successMessage}" class="alert-success-admin">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
      </div>

      <div class="admin-card">
        <div style="font-size:14px;font-weight:600;margin-bottom:16px;color:#111827">
          Danh sách khiếu nại
        </div>

        <form th:action="@{/admin/complaints}" method="get">
          <div class="filter-bar">
            <select name="type">
              <option value="" th:selected="${type == null or type == ''}">Loại báo cáo</option>
              <option th:each="t : ${types}"
                      th:value="${t.name()}"
                      th:text="${t.name()}"
                      th:selected="${t.name() == type}">
              </option>
            </select>
            <select name="status">
              <option value="" th:selected="${status == null or status == ''}">Trạng thái</option>
              <option th:each="s : ${statuses}"
                      th:value="${s.name()}"
                      th:text="${s.name() == 'Pending' ? 'Chờ xử lý' :
                                 s.name() == 'Resolved' ? 'Đã xử lý' : s.name()}"
                      th:selected="${s.name() == status}">
              </option>
            </select>
            <input type="text" name="keyword"
                   placeholder="Tìm theo tên, SĐT…"
                   th:value="${keyword}"/>
            <button type="submit" class="btn-search">
              <i class="bi bi-search"></i> Tìm kiếm
            </button>
            <a th:href="@{/admin/complaints}" class="btn-clear">Xóa lọc</a>
          </div>
        </form>

        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:40px">STT</th>
              <th>Người gửi</th>
              <th>Loại khiếu nại</th>
              <th>Mã đơn thuê</th>
              <th>Ngày gửi</th>
              <th>Trạng thái</th>
              <th style="width:70px"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(complaints.content)}">
              <td colspan="7" class="empty-state">
                <i class="bi bi-inbox" style="font-size:24px;display:block;margin-bottom:8px"></i>
                Không có khiếu nại nào
              </td>
            </tr>
            <tr th:each="c, iter : ${complaints.content}">
              <td style="color:#9ca3af"
                  th:text="${complaints.number * 10 + iter.index + 1}"></td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:28px;height:28px;border-radius:50%;background:#ede9fe;
                               color:#5b21b6;display:flex;align-items:center;justify-content:center;
                               font-size:10px;font-weight:600;flex-shrink:0"
                       th:text="${#strings.substring(c.senderName,0,1)}"></div>
                  <div>
                    <div th:text="${c.senderName}"></div>
                    <div class="text-muted-small" th:text="${c.senderPhone}"></div>
                  </div>
                </div>
              </td>
              <td th:text="${c.type.name()}"></td>
              <td>
                <span style="font-family:monospace;font-size:12px;color:#6b7280"
                      th:text="${'#' + c.orderId}"></span>
              </td>
              <td style="color:#6b7280"
                  th:text="${#temporals.format(c.createdAt,'dd/MM/yyyy HH:mm')}"></td>
              <td>
				<span th:class="${c.status.name() == 'Resolved' ? 'badge-approved' :
				                  c.status.name() == 'Rejected' ? 'badge-rejected' :
				                  c.status.name() == 'Processing' ? 'badge-none' : 'badge-pending'}"
				      th:text="${c.status.name() == 'Resolved'   ? 'Đã xử lý' :
				                 c.status.name() == 'Rejected'   ? 'Đã từ chối' :
				                 c.status.name() == 'Processing' ? 'Đang xử lý' : 'Chờ xử lý'}">
				</span>
              </td>
              <td>
                <a th:href="@{/admin/complaints/{id}(id=${c.complaintId})}"
                   style="font-size:12px;color:#7F77DD;text-decoration:none;
                          border:1px solid #7F77DD;padding:3px 10px;border-radius:6px">
                  Xem
                </a>
              </td>
            </tr>
          </tbody>
        </table>

        <th:block th:replace="~{fragments/admin-layout :: pagination(
            ${complaints}, '/admin/complaints', ${extraParams})}">
        </th:block>
      </div>

    </div>
  </div>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
