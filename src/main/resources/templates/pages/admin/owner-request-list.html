<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Duyệt yêu cầu chủ xe')}"></head>
<body>
<div class="admin-wrapper">

  <th:block th:replace="~{fragments/admin-layout :: sidebar('owner-requests')}"></th:block>

  <div class="admin-body">
    <th:block th:replace="~{fragments/admin-layout :: topbar(
        'Duyệt yêu cầu chủ xe',
        'Admin / <span>Yêu cầu chủ xe</span>')}">
    </th:block>

    <div class="admin-content">

      <div th:if="${successMessage}" class="alert-success-admin">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
      </div>

      <div class="admin-card">
        <div style="font-size:14px;font-weight:600;margin-bottom:16px;color:#111827">
          Danh sách yêu cầu
        </div>

        <form th:action="@{/admin/owner-requests}" method="get">
          <div class="filter-bar">
            <select name="status">
              <option value="" th:selected="${status == null or status == ''}">Trạng thái</option>
              <option value="Pending"  th:selected="${status == 'Pending'}">Chờ duyệt</option>
              <option value="Approved" th:selected="${status == 'Approved'}">Đã duyệt</option>
              <option value="Rejected" th:selected="${status == 'Rejected'}">Đã từ chối</option>
            </select>
            <input type="text" name="keyword"
                   placeholder="Tìm theo tên, SĐT…"
                   th:value="${keyword}"/>
            <button type="submit" class="btn-search">
              <i class="bi bi-search"></i> Tìm kiếm
            </button>
            <a th:href="@{/admin/owner-requests}" class="btn-clear">Xóa lọc</a>
          </div>
        </form>

        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:40px">STT</th>
              <th>Họ tên</th>
              <th>Số điện thoại</th>
              <th>Ngày nộp</th>
              <th>Trạng thái</th>
              <th style="width:70px"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(requests.content)}">
              <td colspan="6" class="empty-state">
                <i class="bi bi-inbox" style="font-size:24px;display:block;margin-bottom:8px"></i>
                Không có yêu cầu nào
              </td>
            </tr>
            <tr th:each="r, iter : ${requests.content}">
              <td style="color:#9ca3af"
                  th:text="${requests.number * 10 + iter.index + 1}"></td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:28px;height:28px;border-radius:50%;background:#ede9fe;
                               color:#5b21b6;display:flex;align-items:center;justify-content:center;
                               font-size:10px;font-weight:600;flex-shrink:0"
                       th:text="${#strings.substring(r.fullName,0,1)}"></div>
                  <span th:text="${r.fullName}"></span>
                </div>
              </td>
              <td th:text="${r.phone}"></td>
              <td th:text="${#temporals.format(r.submittedAt,'dd/MM/yyyy HH:mm')}"
                  style="color:#6b7280"></td>
              <td>
                <span th:class="${r.status.name() == 'Approved' ? 'badge-approved' :
                                  r.status.name() == 'Rejected' ? 'badge-rejected' : 'badge-pending'}"
                      th:text="${r.status.name() == 'Approved' ? 'Đã duyệt' :
                                 r.status.name() == 'Rejected' ? 'Đã từ chối' : 'Chờ duyệt'}">
                </span>
              </td>
              <td>
                <a th:href="@{/admin/owner-requests/{id}(id=${r.registrationId}, returnPage=${requests.number})}"
                   style="font-size:12px;color:#7F77DD;text-decoration:none;
                          border:1px solid #7F77DD;padding:3px 10px;border-radius:6px">
                  Xem
                </a>
              </td>
            </tr>
          </tbody>
        </table>

        <th:block th:replace="~{fragments/admin-layout :: pagination(
            ${requests}, '/admin/owner-requests', ${extraParams})}">
        </th:block>
      </div>

    </div>
  </div>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
