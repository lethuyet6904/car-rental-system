<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách xe cho thuê - Carto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .car-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .car-image {
            height: 200px;
            object-fit: cover;
        }
        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-active {
            background-color: #28a745;
            color: white;
        }
        .status-inactive {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Carto</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/login">Đăng nhập</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/register">Đăng ký</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-4">
    
    <!-- Filter Section -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/cars}" method="get" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Địa điểm</label>
                    <select name="city" class="form-select">
                        <option value="">Tất cả địa điểm</option>
                        <option th:each="region : ${regions}" 
                                th:value="${region.regionName}"
                                th:text="${region.regionName}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ngày nhận</label>
                    <input type="date" name="dateFrom" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ngày trả</label>
                    <input type="date" name="dateTo" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>
            <i class="fa-solid fa-car-side text-primary"></i> 
            Xe cho thuê
            <span class="badge bg-secondary ms-2" th:text="${#lists.size(cars)} + ' xe'"></span>
        </h3>
    </div>
    
    <!-- Cars Grid -->
    <div th:if="${#lists.isEmpty(cars)}" class="text-center py-5">
        <i class="fa-solid fa-car-side fa-4x text-muted mb-3"></i>
        <h4>Không tìm thấy xe nào</h4>
    </div>
    
    <div class="row" th:if="${!#lists.isEmpty(cars)}">
        <div class="col-md-6 col-lg-4 col-xl-3" th:each="car : ${cars}">
            <div class="card car-card h-100">
                <div class="position-relative">
                    <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=600&q=80" 
                         class="card-img-top car-image" alt="Car">
                    <span class="status-badge" 
                          th:classappend="${car.status} == 'Active' ? 'status-active' : 'status-inactive'"
                          th:text="${car.status} == 'Active' ? 'Sẵn sàng' : 'Tạm ngưng'">
                    </span>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${car.modelName}">Tên xe</h5>
                    <p class="card-text text-muted small">
                        <i class="fa-solid fa-car"></i> 
                        <span th:text="${car.brand != null ? car.brand.brandName : 'N/A'}"></span><br>
                        <i class="fa-solid fa-chair"></i> <span th:text="${car.seats}"></span> chỗ<br>
                        <i class="fa-solid fa-gear"></i> 
                        <span th:text="${car.transmission} == 'Automatic' ? 'Tự động' : 'Số sàn'"></span><br>
                        <i class="fa-solid fa-gas-pump"></i> 
                        <span th:text="${car.fuel} == 'Gasoline' ? 'Xăng' : (car.fuel == 'Electric' ? 'Điện' : 'Dầu')"></span>
                    </p>
                    <p class="text-muted small">
                        <i class="fa-solid fa-location-dot"></i> 
                        <span th:text="${car.pickupLocation}"></span>
                    </p>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="price" th:text="${car.pricePerDay} + 'đ'"></span>
                            <small class="text-muted">/ngày</small>
                        </div>
                        <a th:href="@{'/cars/' + ${car.carId}}" class="btn btn-sm btn-outline-primary">
                            Xem chi tiết <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
