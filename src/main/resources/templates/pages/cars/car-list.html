<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Danh sách xe – Thuê xe tự lái', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/cars.css}" />
    <!-- Reuse home.css for car card styling -->
    <link rel="stylesheet" th:href="@{/assets/css/home.css}" />
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="ct-cars-page ct-section bg-light">
        <div class="container px-4">
            
            <div class="ct-search-wrap" style="position: relative; margin-top: -20px; margin-bottom: 40px; transform: none; box-shadow: none;">
                <div class="ct-search-card shadow-sm border" style="border-radius: 16px;">
                    <form th:action="@{/cars/search}" method="GET">
                        <div class="ct-search-fields">
                            <div class="ct-field" style="flex: 1.5;">
                                <label class="ct-field__label" for="city">
                                    <i class="fa-solid fa-location-dot"></i> Địa điểm
                                </label>
                                <input type="text" class="ct-field__input" id="city" name="city" th:value="${selectedCity}" placeholder="Thành phố, quận huyện...">
                            </div>

                            <div class="ct-field-divider"></div>

                            <div class="ct-field">
                                <label class="ct-field__label" for="transmission">
                                    <i class="fa-solid fa-microchip"></i> Truyền động
                                </label>
                                <select class="ct-field__input" id="transmission" name="transmission" style="border: none; outline: none; background: transparent; width: 100%; cursor: pointer;">
                                    <option value="">Tất cả</option>
                                    <option value="Automatic" th:selected="${selectedTransmission == 'Automatic'}">Số tự động</option>
                                    <option value="Manual" th:selected="${selectedTransmission == 'Manual'}">Số sàn</option>
                                </select>
                            </div>

                            <div class="ct-field-divider"></div>

                            <div class="ct-field">
                                <label class="ct-field__label" for="fuel">
                                    <i class="fa-solid fa-gas-pump"></i> Nhiên liệu
                                </label>
                                <select class="ct-field__input" id="fuel" name="fuel" style="border: none; outline: none; background: transparent; width: 100%; cursor: pointer;">
                                    <option value="">Tất cả</option>
                                    <option value="Gasoline" th:selected="${selectedFuel == 'Gasoline'}">Xăng</option>
                                    <option value="Diesel" th:selected="${selectedFuel == 'Diesel'}">Dầu</option>
                                    <option value="Electric" th:selected="${selectedFuel == 'Electric'}">Điện</option>
                                </select>
                            </div>

                            <button type="submit" class="ct-search-btn" style="border-radius: 12px; margin: 8px;">
                                <i class="fa-solid fa-magnifying-glass"></i> Lọc kết quả
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h2 class="ct-section-title mb-0">Tất cả xe có sẵn</h2>
                    <p class="text-muted mt-2 mb-0" th:if="${selectedCity != null and !selectedCity.isEmpty()}">Kết quả tìm kiếm cho: <strong th:text="${selectedCity}"></strong></p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Vòng lặp xe -->
                <div class="col-xl-3 col-lg-4 col-md-6" th:each="car : ${cars}">
                    <a th:href="@{'/cars/' + ${car.carId}}" class="ct-car-link">
                        <div class="ct-car-card">
                            <div class="ct-car-card__thumb">
                                <img th:src="${car.thumbnailUrl != null ? car.thumbnailUrl : '/assets/images/car-placeholder.png'}"
                                    th:alt="${car.modelName}" />
                            </div>
                            <div class="ct-car-card__body">
                                <div class="ct-car-features-pill">
                                    <span class="feature-pill"><i class="fa-solid fa-location-dot"
                                            style="color: #FF5722;"></i> Giao xe tận nơi</span>
                                </div>

                                <h3 class="ct-car-name mt-3" th:text="${car.modelName}">Tên xe</h3>

                                <div class="ct-car-specs">
                                    <span class="spec-item"><i class="fa-solid fa-microchip"></i> <span
                                            th:text="${car.transmission.name() == 'Automatic' ? 'Số tự động' : 'Số sàn'}">Số
                                            tự động</span></span>
                                    <span class="spec-item"><i class="fa-regular fa-user"></i> <span
                                            th:text="${car.seats + ' chỗ'}">5 chỗ</span></span>
                                    <span class="spec-item"><i class="fa-solid fa-gas-pump"></i> <span
                                            th:text="${car.fuel.name() == 'Gasoline' ? 'Xăng' : (car.fuel.name() == 'Electric' ? 'Điện' : 'Dầu')}">Xăng</span></span>
                                </div>

                                <div class="ct-car-location mt-3">
                                    <i class="fa-solid fa-location-dot" style="color: #0F172A;"></i>
                                    <span th:text="${car.pickupLocation}">Phường 25, Quận Bình Thạnh</span>
                                </div>

                                <hr class="ct-card-divider" />

                                <div class="ct-car-price-row">
                                    <div class="ct-car-rating-trips">
                                        <i class="fa-solid fa-star text-warning"></i>
                                        <span class="rating-val" th:text="${car.avgRating}">5.0</span>
                                    </div>
                                    <div class="ct-car-price-new">
                                        <strong class="price-highlight"
                                            th:text="${#numbers.formatInteger(car.pricePerDay, 0, 'COMMA') + 'đ'}">809K</strong>
                                        <span class="price-unit">/ngày</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Empty state -->
                <div class="col-12 text-center py-5" th:if="${cars == null or cars.isEmpty()}">
                    <img src="/assets/images/empty.png" alt="No cars" style="max-width: 200px; opacity: 0.5; margin-bottom: 20px;">
                    <h4 class="text-muted">Không tìm thấy xe phù hợp</h4>
                    <p class="text-muted">Hãy thử thay đổi địa điểm hoặc điều kiện tìm kiếm.</p>
                </div>
            </div>
            
            <!-- Phân trang -->
            <div class="row mt-5" th:if="${pageInfo != null and pageInfo.totalPages > 1}">
                <div class="col-12 d-flex justify-content-center">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${pageInfo.first} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/cars/search(city=${selectedCity}, transmission=${selectedTransmission}, fuel=${selectedFuel}, page=${pageInfo.number - 1})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, pageInfo.totalPages - 1)}" 
                                th:classappend="${i == pageInfo.number} ? 'active' : ''">
                                <a class="page-link" th:href="@{/cars/search(city=${selectedCity}, transmission=${selectedTransmission}, fuel=${selectedFuel}, page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${pageInfo.last} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/cars/search(city=${selectedCity}, transmission=${selectedTransmission}, fuel=${selectedFuel}, page=${pageInfo.number + 1})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </section>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
