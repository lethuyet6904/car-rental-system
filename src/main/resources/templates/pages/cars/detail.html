<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${car.modelName} + ' - Carto'">Chi tiết xe - Carto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .car-detail-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
        }
        .price-large {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .info-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .info-label {
            font-weight: 600;
            color: #6c757d;
            width: 120px;
            display: inline-block;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-active {
            background-color: #d4edda;
            color: #155724;
        }
        .status-inactive {
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Carto</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/cars">Danh sách xe</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/login">Đăng nhập</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
    <div th:if="${car != null}">
        
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/cars">Xe cho thuê</a></li>
                <li class="breadcrumb-item active" th:text="${car.modelName}">Tên xe</li>
            </ol>
        </nav>
        
        <div class="row">
            <!-- Image -->
            <div class="col-md-6 mb-4">
                <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=800&q=80" 
                     class="car-detail-image" alt="Car image">
            </div>
            
            <!-- Info -->
            <div class="col-md-6">
                <h1 th:text="${car.modelName}">Tên xe</h1>
                <p class="text-muted" th:text="${car.brand != null ? car.brand.brandName : 'N/A'}">Thương hiệu</p>
                
                <!-- Rating -->
                <div class="mb-3">
                    <span class="text-warning">
                        <i class="fa-solid fa-star"></i> 
                        <span th:text="${car.avgRating}"></span>/5
                    </span>
                </div>
                
                <!-- Status -->
                <div class="mb-3">
                    <span class="status-badge" 
                          th:classappend="${car.status} == 'Active' ? 'status-active' : 'status-inactive'"
                          th:text="${car.status} == 'Active' ? '✓ Sẵn sàng cho thuê' : '✗ Tạm ngưng'">
                    </span>
                </div>
                
                <hr>
                
                <!-- Specifications -->
                <div class="info-section">
                    <h5><i class="fa-solid fa-car"></i> Thông số kỹ thuật</h5>
                    <table class="table table-borderless">
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-car"></i> Thương hiệu:</td>
                            <td th:text="${car.brand != null ? car.brand.brandName : 'N/A'}"></td>
                        </tr>
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-chair"></i> Số ghế:</td>
                            <td th:text="${car.seats} + ' chỗ'"></td>
                        </tr>
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-calendar"></i> Năm sản xuất:</td>
                            <td th:text="${car.yearOfManufacture}"></td>
                        </tr>
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-gear"></i> Hộp số:</td>
                            <td th:text="${car.transmission} == 'Automatic' ? 'Tự động' : 'Số sàn'"></td>
                        </tr>
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-gas-pump"></i> Nhiên liệu:</td>
                            <td th:text="${car.fuel} == 'Gasoline' ? 'Xăng' : (car.fuel == 'Electric' ? 'Điện' : 'Dầu')"></td>
                        </tr>
                        <tr>
                            <td class="info-label"><i class="fa-solid fa-location-dot"></i> Địa điểm nhận:</td>
                            <td th:text="${car.pickupLocation}"></td>
                        </tr>
                        <tr th:if="${car.features != null}">
                            <td class="info-label"><i class="fa-solid fa-list-check"></i> Tiện ích:</td>
                            <td th:text="${car.features}"></td>
                        </tr>
                    </table>
                </div>
                
                <!-- Description -->
                <div th:if="${car.description != null}" class="info-section">
                    <h5><i class="fa-solid fa-file-lines"></i> Mô tả</h5>
                    <p class="text-muted" th:text="${car.description}"></p>
                </div>
                
                <!-- Price & Booking -->
                <div class="info-section">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="price-large" th:text="${car.pricePerDay} + 'đ'"></span>
                            <small class="text-muted">/ngày</small>
                        </div>
                        <button class="btn btn-primary btn-lg" th:if="${car.status} == 'Active'">
                            <i class="fa-regular fa-calendar-check"></i> Đặt xe ngay
                        </button>
                        <button class="btn btn-secondary btn-lg" th:if="${car.status} != 'Active'" disabled>
                            <i class="fa-solid fa-clock"></i> Xe chưa sẵn sàng
                        </button>
                    </div>
                </div>
                
            </div>
        </div>
        
    </div>
    
    <!-- Không tìm thấy xe -->
    <div th:if="${car == null}" class="text-center py-5">
        <h3>Không tìm thấy thông tin xe</h3>
        <a href="/cars" class="btn btn-primary">Quay lại danh sách xe</a>
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
