<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quản lý Đơn hàng - Chủ xe', ~{::link})}">
    <link rel="stylesheet" th:href="@{/assets/css/owner.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar" style="min-height: calc(100vh - 70px);">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/owner/dashboard}"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/owner/cars}"><i class="fa-solid fa-car"></i> Quản lý xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active" th:href="@{/owner/orders}"><i class="fa-solid fa-truck"></i> Quản lý đơn hàng</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2">Quản lý Đơn hàng</h1>
            </div>

            <!-- Alert -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Xe</th>
                                    <th>Nhận xe</th>
                                    <th>Trả xe</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td>#<span th:text="${order.orderId}"></span></td>
                                    <td th:text="${order.customer?.fullName} ?: 'N/A'"></td>
                                    <td th:text="${(order.car?.brand?.brandName ?: '') + ' ' + (order.car?.modelName ?: 'N/A')}"></td>
                                    <td th:text="${#temporals.format(order.pickupDate, 'dd/MM/yyyy')} + ' ' + ${order.pickupTime}"></td>
                                    <td th:text="${#temporals.format(order.returnDate, 'dd/MM/yyyy')} + ' ' + ${order.returnTime}"></td>
                                    <td th:text="${#numbers.formatInteger(order.totalAmount ?: 0, 0, 'COMMA')} + 'đ'"></td>
                                    <td>
                                        <span th:if="${order.status?.name() == 'Pending'}" class="badge bg-warning">Chờ xác nhận</span>
                                        <span th:if="${order.status?.name() == 'Confirmed'}" class="badge bg-info">Đã xác nhận</span>
                                        <span th:if="${order.status?.name() == 'InProgress'}" class="badge bg-primary">Đang thuê</span>
                                        <span th:if="${order.status?.name() == 'Completed'}" class="badge bg-success">Hoàn thành</span>
                                        <span th:if="${order.status?.name() == 'Rejected'}" class="badge bg-secondary">Từ chối</span>
                                    </td>
                                    <td>
                                        <div th:if="${order.status?.name() == 'Pending'}">
                                            <!-- Duyệt -->
                                            <form th:action="@{/owner/orders/{orderId}/confirm(orderId=${order.orderId})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-success"
                                                        onclick="return confirm('Duyệt đơn hàng này?')">Duyệt</button>
                                            </form>

                                            <!-- Từ chối -->
                                            <button type="button" class="btn btn-sm btn-danger ms-2"
                                                    data-bs-toggle="modal" 
                                                    data-bs-target="#rejectModal"
                                                    th:data-order-id="${order.orderId}">
                                                Từ chối
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${orders == null or orders.isEmpty()}">
                                    <td colspan="8" class="text-center py-5 text-muted">Chưa có đơn hàng nào</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- MODAL TỪ CHỐI -->
<div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Từ chối đơn hàng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="rejectForm" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Lý do từ chối <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="rejectReason" name="reason" rows="5" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger" onclick="submitReject()">Xác nhận từ chối</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentRejectOrderId = null;

    // Khi modal được mở
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('rejectModal');
        modal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            currentRejectOrderId = button.getAttribute('data-order-id');
        });
    });

    function submitReject() {
        const reasonField = document.getElementById('rejectReason');
        const reason = reasonField.value.trim();

        if (!reason) {
            alert("Vui lòng nhập lý do từ chối!");
            reasonField.focus();
            return;
        }

        if (!currentRejectOrderId) {
            alert("Lỗi hệ thống: Không tìm thấy mã đơn hàng!");
            return;
        }

        const form = document.getElementById('rejectForm');
        form.action = `/owner/orders/${currentRejectOrderId}/reject`;
        form.submit();
    }
</script>

</body>
</html>
